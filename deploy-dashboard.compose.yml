services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yangyuen_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yangyuen_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dashboard_internal

  app:
    image: ${IMAGE_REPO:-yangyuen-dashboard}:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/yangyuen_dashboard
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      TOKEN_IMAGE_DIR: /app/data/token-images
      BATCH_SCHEDULER_SECRET: ${BATCH_SCHEDULER_SECRET:?BATCH_SCHEDULER_SECRET is required}
    volumes:
      - token_images:/app/data/token-images
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      dashboard_internal:
      caddy_proxy:
        aliases:
          - yangyuen-dashboard-app

  scheduler:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      BATCH_SCHEDULER_SECRET: ${BATCH_SCHEDULER_SECRET:?BATCH_SCHEDULER_SECRET is required}
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' '#!/bin/sh' "exec wget -qO- --post-data=\"\" --header=\"Authorization: Bearer \$$BATCH_SCHEDULER_SECRET\" http://app:3000/api/internal/batch-schedule/run" > /usr/local/bin/run-batch-schedule
        chmod 700 /usr/local/bin/run-batch-schedule
        echo '0 * * * * /usr/local/bin/run-batch-schedule' > /etc/crontabs/root
        exec crond -f -l 2
    depends_on:
      app:
        condition: service_healthy
    networks:
      - dashboard_internal

  migrate:
    image: node:22-alpine
    profiles:
      - tools
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/yangyuen_dashboard
    command: sh -c "npm ci --ignore-scripts && npx prisma migrate deploy"
    volumes:
      - ./migrate-src:/workspace
    networks:
      - dashboard_internal

volumes:
  postgres_data:
  migrate_node_modules:
  token_images:

networks:
  dashboard_internal:
  caddy_proxy:
    external: true
    name: yangyuen_default
